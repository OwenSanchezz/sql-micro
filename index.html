<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#208aef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CodeQuet">
  <meta name="description" content="Aprende Linux, PostgreSQL, Docker, redes, nube y programación con CodeQuet.">
  <link rel="manifest" href="./manifest.json?v=codequet-21">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=codequet-21">
  <title>CodeQuet</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar" id="topbar" hidden>
      <button class="icon-button" id="back-button" aria-label="Volver a lecciones">←</button>
      <div class="progress-track" aria-label="Progreso de la lección"><div id="progress-fill"></div></div>
      <div class="hearts" aria-label="Vidas restantes"><span aria-hidden="true">♥</span> <b id="heart-count">5</b></div>
    </header>
    <main id="screen" class="screen" tabindex="-1"></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegación principal"></nav>
  </div>
  <div id="splash" class="splash-screen" aria-label="CodeQuet está cargando">
    <img src="./assets/codequet/splash-blue.jpg" alt="CodeQuet y Quet">
  </div>
  <script src="./vendor/sql-wasm.js?v=codequet-21"></script>
  <script type="module" src="./app.js?v=codequet-21"></script>
</body>
</html>
