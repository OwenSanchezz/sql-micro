<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a27">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CodeQuet SQL">
  <meta name="description" content="Aprende SQL desde cero con micro-lecciones interactivas.">
  <link rel="manifest" href="./manifest.json?v=codequet-2">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=codequet-2">
  <title>CodeQuet SQL · Paso a Paso</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar" id="topbar" hidden>
      <button class="icon-button" id="back-button" aria-label="Volver a lecciones">←</button>
      <div class="progress-track" aria-label="Progreso de la lección"><div id="progress-fill"></div></div>
      <div class="hearts" aria-label="Vidas restantes"><span aria-hidden="true">♥</span> <b id="heart-count">5</b></div>
    </header>
    <main id="screen" class="screen" tabindex="-1"></main>
    <footer class="site-footer">Contenido propio. Inspirado en freeCodeCamp y Duolingo.</footer>
  </div>
  <script src="./vendor/sql-wasm.js?v=codequet-2"></script>
  <script type="module" src="./app.js?v=codequet-2"></script>

</html>
